spring.application.name=freelancehub

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

# Cloudflare R2 Storage
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.public-url=${R2_PUBLIC_URL}

# Multipart upload limit (10 MB for message attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Production / CORS ─────────────────────────────
# Set FRONTEND_URL=https://additi-final-project.vercel.app on Render
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ── Cookie security ───────────────────────────────
# Set COOKIE_SECURE=true and COOKIE_SAME_SITE=None on Render (required for cross-domain)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}



